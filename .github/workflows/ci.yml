name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          {
            echo "### Versions"
            echo '```'
            python --version
            pip show ruff pytest | grep -E "^(Name|Version):"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff
        run: |
          set +e
          ruff check src tests apps --output-format=concise > /tmp/ruff.txt 2>&1
          code=$?
          {
            echo "### Ruff (exit $code)"
            echo '```'
            cat /tmp/ruff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ruff.txt
          exit $code
      - name: Pytest
        run: |
          set +e
          pytest -v > /tmp/pytest.txt 2>&1
          code=$?
          {
            echo "### Pytest (exit $code)"
            echo '```'
            tail -100 /tmp/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pytest.txt
          exit $code

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
