name: manual-signal-check

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Symbol (^NDX, ^GSPC, or 'both')"
        default: "both"
        required: true
      force_alert:
        description: "Send alert even if no signal triggers"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Run signal check (manual)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: |
          python -m cli.main --mode manual --asset "${{ inputs.asset }}" ${{ inputs.force_alert == true && '--force-alert' || '' }}
