name: scheduled-signal-check

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 & 18:00 UTC — aligns with 12H rhythm
  workflow_dispatch: {}
  push:
    branches: [main, claude/festive-edison-i7L7N]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/scheduled.yml"
      - "pyproject.toml"

permissions:
  contents: write   # needed to push the signals.json snapshot to the `data` branch

concurrency:
  group: scheduled-signal-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e .

      - name: Restore idempotency state
        uses: actions/cache@v5
        with:
          path: state/
          key: alerts-state-${{ github.run_id }}
          restore-keys: |
            alerts-state-

      - name: Run signal check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: python -m cli.main --mode scheduled

      - name: Generate dashboard snapshot
        env:
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: python -m cli.snapshot --output signals.json

      - name: Publish signals.json to `data` branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          pub=$(mktemp -d)
          cp signals.json "$pub/payload.json"
          cd "$pub"
          REMOTE="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          if git clone --branch data --depth 1 "$REMOTE" repo 2>/dev/null; then
            cd repo
          else
            git clone --depth 1 "$REMOTE" repo
            cd repo
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mv ../payload.json signals.json
          git config user.name "buy-the-dip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json
          if git diff --cached --quiet; then
            echo "no change to signals.json"
            exit 0
          fi
          git commit -m "data: snapshot ${{ github.run_id }}"
          git push origin HEAD:data

      - name: Apply DB migrations (skipped when no Postgres secret is set)
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          set -e
          if [ -z "$POSTGRES_URL" ] && [ -z "$POSTGRES_URL_NON_POOLING" ]; then
            echo "no Postgres secret set — skipping alembic upgrade"
            exit 0
          fi
          python -m alembic upgrade head

      - name: Upload alert state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alerts-state
          path: state/
          if-no-files-found: ignore
          retention-days: 30
