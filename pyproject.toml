[project]
name = "buy-the-dip"
version = "0.1.0"
description = "Modular signal bot framework with a buy-the-dip RSI/EMA strategy for NDX & SPX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "buy-the-dip contributors" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]
backtest = [
    "vectorbt>=0.26; python_version < '3.13'",
]

[project.scripts]
btd = "cli.main:main"
btd-backtest = "cli.backtest:main"
btd-validate-tv = "cli.validate_tv:main"
btd-snapshot = "cli.snapshot:main"
btd-dca = "cli.dca:main"
btd-history = "cli.history:main"
btd-trade = "cli.trade:main"
btd-refresh = "cli.refresh:main"

[tool.vercel]
# Vercel auto-detects the FastAPI app from this entrypoint when deploying
# the repo root as a Python project. See docs/architecture.md for the
# split-deployment notes (web should be a separate Vercel project pointed
# at apps/web).
entrypoint = "apps.api.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["bot_core", "strategies", "cli", "apps"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
