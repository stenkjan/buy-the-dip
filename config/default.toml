# Bot configuration. Only non-secret, behavioural settings live here.
# Secrets (API tokens, chat IDs) come from environment variables only.

[bot]
strategy = "buy_the_dip"
mode = "scheduled"  # "scheduled" | "manual"
dry_run = true

[data]
provider = "yfinance"  # "yfinance" | "polygon" | "tiingo"
assets = ["^NDX", "^GSPC"]
lookback_days_intraday = 60
lookback_years_daily = 25

[indicators]
rsi_length = 14
rsi_smoothing = "wilder"  # MUST be wilder to match TradingView
ema_length = 200

[strategy.buy_the_dip]
# Standard thresholds (RSI <= threshold => oversold).
rsi_threshold_stufe1 = 30.0
rsi_threshold_stufe2 = 30.0
rsi_threshold_stufe3 = 30.0
# Liberal thresholds (used if `liberal = true`).
rsi_threshold_stufe1_liberal = 35.0   # only inside macro_reclaim
rsi_threshold_stufe2_liberal = 30.5
rsi_threshold_stufe3_liberal = 32.0
liberal = true
macro_reclaim_window_weeks = 8

# Tranche recommendations in % of total capital (informational only).
tranche_stufe1 = [10, 20]
tranche_stufe2 = [20, 40]
tranche_stufe3 = [40, 60]

[alerts]
channels = ["console"]  # add "telegram" once secrets are configured
idempotency_dir = "state"

[api]
cors_origins = ["http://localhost:5173"]
